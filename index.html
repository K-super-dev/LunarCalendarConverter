<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>음력 → 양력 변환 서비스</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h2 class="mb-4">음력 → 양력 변환 서비스</h2>

    <!-- 음력 날짜 선택 -->
    <div class="mb-3">
      <label for="lunarDate" class="form-label">음력 날짜 선택</label>
      <input type="date" class="form-control" id="lunarDate">
    </div>

    <!-- 변환할 연수 입력 -->
    <div class="mb-3">
      <label for="yearsToConvert" class="form-label">몇 년분 변환할까?</label>
      <input type="number" class="form-control" id="yearsToConvert" min="1" max="20" value="5">
    </div>

    <!-- 이벤트 제목 입력 -->
    <div class="mb-3">
      <label for="eventTitle" class="form-label">이벤트 제목 입력</label>
      <input type="text" class="form-control" id="eventTitle" placeholder="예: 생일, 기일 등">
    </div>

    <!-- 이벤트 상세 입력 -->
    <div class="mb-3">
      <label for="eventDetails" class="form-label">이벤트 상세 입력</label>
      <textarea class="form-control" id="eventDetails" rows="3" placeholder="자세한 설명 입력"></textarea>
    </div>
    <!-- 변환된 날짜 표시 -->
    <div class="mb-4">
      <label class="form-label">변환된 날짜 표시</label>
      <div id="convertedDates">
        <span class="badge bg-primary mb-2">2025: 2월 15일</span>
        <div class="accordion" id="accordionYears">
          <!-- 예시 접기형식 -->
          <div class="accordion-item">
            <h2 class="accordion-header" id="heading2026">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse2026" aria-expanded="false" aria-controls="collapse2026">
                2026년 변환된 날짜
              </button>
            </h2>
            <div id="collapse2026" class="accordion-collapse collapse" aria-labelledby="heading2026" data-bs-parent="#accordionYears">
              <div class="accordion-body">
                2월 3일
              </div>
            </div>
          </div>
          <!-- 나머지 년도들도 이런 식으로 추가 -->
        </div>
      </div>
    </div>

        <!-- 음력으로 변환 버튼 -->
        <div class="mb-3">
            <button class="btn btn-primary" id="convertLunarBtn">음력으로 변환</button>
    <!-- ICS 파일 출력 버튼 -->
    <button class="btn btn-success" id="generateIcsBtn">ICS 파일로 출력</button>
</div>
  </div>

  <script>
  window.API_BASE_URL = ""; // 예: "https://your-api.vercel.app"
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const API_BASE_URL = window.API_BASE_URL || 'http://localhost:3000';
  const lunarDateInput = document.getElementById("lunarDate");
  const yearsInput = document.getElementById("yearsToConvert");
  const convertedDatesDiv = document.getElementById("convertedDates");
  const generateBtn = document.getElementById("generateIcsBtn");
  const convertLunarBtn = document.getElementById("convertLunarBtn");
  
  convertLunarBtn.addEventListener("click", async () => {
    const lunarDate = lunarDateInput.value;
    const years = parseInt(yearsInput.value);
    if (!lunarDate || isNaN(years)) {
      alert("날짜와 연수 모두 입력해주세요.");
      return;
    }

    const [year, month, day] = lunarDate.split("-");
    const untilYear = parseInt(year) + years - 1;
    const yyyymmdd = `${year}${month}${day}`;

    try {
      const res = await fetch(`${API_BASE_URL}/api/convert?solarDate=${yyyymmdd}&untilYear=${untilYear}`);
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }

      const list = data.results;
      convertedDatesDiv.innerHTML = '';
      list.forEach((item, index) => {
        const label = document.createElement("div");
        label.className = "mb-2";
        label.innerHTML = index === 0
          ? `<span class="badge bg-primary">${item.year}: ${item.lunarDay}</span>`
          : `
            <div class="accordion-item">
              <h2 class="accordion-header" id="heading${item.year}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${item.year}" aria-expanded="false" aria-controls="collapse${item.year}">
                  ${item.year}년 변환된 날짜
                </button>
              </h2>
              <div id="collapse${item.year}" class="accordion-collapse collapse" aria-labelledby="heading${item.year}" data-bs-parent="#accordionYears">
                <div class="accordion-body">${item.lunarDay}</div>
              </div>
            </div>`;
        convertedDatesDiv.appendChild(label);
      });
    } catch (err) {
      console.error("API 호출 오류:", err);
      alert("API 호출 중 오류 발생");
    }
  });
});
  </script>
</body>
</html>
