<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>음력을 양력으로 변환해서 ics파일로 출력하는 서비스</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container">
        <h2 class="mb-4">음력을 양력으로 변환해서 ics파일로 출력하는 서비스</h2>

        <!-- 음력 날짜 입력 -->
        <div class="mb-3">
            <label for="lunarDate" class="form-label">음력 날짜 입력</label>
            <input type="number" class="form-control" id="lunarDate" placeholder="음력 날짜[MMDD] (예: 0401)">
        </div>

        <!-- 변환할 연도 범위 입력 -->
        <div class="mb-3">
            <label class="form-label">몇 년부터 몇 년까지 확인</label>
            <div class="row g-2">
                <div class="col-12 col-md-6">
                    <input type="number" class="form-control" id="startYearInput" placeholder="시작 연도 (예: 1800)">
                </div>
                <div class="col-12 col-md-6">
                    <input type="number" class="form-control" id="endYearInput" placeholder="끝 연도 (예: 2101)">
                </div>
            </div>
        </div>

        <!-- 이벤트 제목 입력 -->
        <div class="mb-3">
            <label for="eventTitle" class="form-label">이벤트 제목 입력</label>
            <input type="text" class="form-control" id="eventTitle" placeholder="예: 생일, 기일 등">
        </div>

        <!-- 이벤트 상세 입력 -->
        <div class="mb-3">
            <label for="eventDetails" class="form-label">이벤트 상세 입력</label>
            <textarea class="form-control" id="eventDetails" rows="3" placeholder="자세한 설명 입력"></textarea>
        </div>

        <!-- 변환된 날짜 표시 -->
        <div class="mb-4">
            <label class="form-label">변환된 양력 날짜</label>
            <div id="convertedDates">
            </div>
        </div>

        <!-- 양력으로 변환 버튼 -->
        <div class="mb-3">
            <button class="btn btn-primary" id="convertLunarBtn">양력으로 변환</button>
            <!-- ICS 파일 출력 버튼 -->
            <button class="btn btn-success" id="generateIcsBtn" disabled>ics 파일로 출력</button>
        </div>
        <footer class="text-center mt-5">
        </footer>
    </div>

    <script>
        window.API_BASE_URL = "https://lunar-calendar-converter.vercel.app";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const API_BASE_URL = window.API_BASE_URL || 'http://localhost:3000';
            const lunarDateInput = document.getElementById("lunarDate");
            const startYearInput = document.getElementById("startYearInput");
            const endYearInput = document.getElementById("endYearInput");
            const convertedDatesDiv = document.getElementById("convertedDates");
            const generateBtn = document.getElementById("generateIcsBtn");
            const convertLunarBtn = document.getElementById("convertLunarBtn");
            const eventTitleInput = document.getElementById("eventTitle");
            const eventDetailsInput = document.getElementById("eventDetails");

            convertLunarBtn.addEventListener("click", async () => {
                const lunarDate = parseInt(lunarDateInput.value);
                const startYear = parseInt(startYearInput.value);
                let endYear = parseInt(endYearInput.value);
                if (isNaN(endYear)) {
                  endYear = startYear;
                }
                if (isNaN(lunarDate) || isNaN(startYear) || isNaN(endYear) || startYear > endYear) {
                    alert("음력 날짜와 올바른 연도 범위를 입력해주세요.");
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE_URL}/api/convert?lunarDate=${startYear}` + `${lunarDate}`.padStart(4, '0') + `&untilYear=${endYear}`);
                    const data = await res.json();
                    if (data.error) {
                        alert(data.error);
                        return;
                    }

                    const list = data.results;
                    convertedDatesDiv.innerHTML = '';

                    const listGroup = document.createElement("ul");
                    listGroup.className = "list-group";

                    list.forEach((item) => {
                        const ld = item.solarDate;
                        const solarString = `${ld.year}년 ${ld.month}월 ${ld.day}일 (${ld.dayOfWeek})${ld.leapMonth ? ' [윤달]' : ''}`;
                        const li = document.createElement("li");
                        li.className = "list-group-item";
                        li.textContent = `${solarString}`;
                        listGroup.appendChild(li);
                    });

                    convertedDatesDiv.appendChild(listGroup);
                    generateBtn.disabled = false;

                } catch (err) {
                    console.error("API 호출 오류:", err);
                    alert("API 호출 중 오류 발생");
                }
            });

            generateBtn.addEventListener("click", () => {

                if (!eventTitleInput.value.trim()) {
                    alert("이벤트 제목을 입력해주세요.");
                    return;
                }

                const listItems = convertedDatesDiv.querySelectorAll("li");
                const title = eventTitleInput.value;
                const description = eventDetailsInput.value || "";

                const lines = [
                    "BEGIN:VCALENDAR",
                    "VERSION:2.0",
                    "CALSCALE:GREGORIAN",
                    "PRODID:-//LunarCalendarConverter//ICS Export//EN"
                ];

                listItems.forEach((li, index) => {
                    const dateText = li.textContent.match(/(\d{4})년 (\d{1,2})월 (\d{1,2})일/);
                    if (dateText) {
                        const [_, year, month, day] = dateText;
                        const dt = `${year}${month.padStart(2, "0")}${day.padStart(2, "0")}`;
                        lines.push(
                            "BEGIN:VEVENT",
                            `UID:lunar-${index}@lunarcalendar`,
                            `DTSTAMP:${dt}T090000Z`,
                            `DTSTART;VALUE=DATE:${dt}`,
                            `SUMMARY:${title}`,
                            `DESCRIPTION:${description}`,
                            "END:VEVENT"
                        );
                    }
                });

                lines.push("END:VCALENDAR");

                const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "converted_dates.ics";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>
</body>

</html>
